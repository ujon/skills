<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Interview · Task map</title>
<style>
:root {
 color-scheme: light;
 --bg: #f3f5f8; --ink: #20242c; --muted: #6e7684;
 --glass: rgba(255,255,255,.48); --solid: #f7f9fc;
 --line: rgba(98,114,137,.14); --rim: rgba(255,255,255,.86);
 --edge: #9baaba; --accent: #007aff; --accent-soft: rgba(0,122,255,.09);
 --amber: #95621d; --amber-soft: rgba(197,148,70,.09); --green: #258266;
 --shadow: 0 8px 32px rgba(33,52,83,.065), 0 1px 3px rgba(33,52,83,.04), inset 0 1px 0 var(--rim), inset 0 -1px 0 rgba(255,255,255,.3);
 --dot: rgba(98,119,145,.13); --card: rgba(255,255,255,.9);
 --focus: #007aff; --danger: #b84250;
}
:root[data-theme=dark] {
 color-scheme: dark;
 --bg: #11151c; --ink: #eff2f7; --muted: #9aa7b9;
 --glass: rgba(39,47,61,.56); --solid: #202733;
 --line: rgba(176,194,221,.13); --rim: rgba(255,255,255,.18);
 --edge: #60768f; --accent: #73b6ff; --accent-soft: rgba(100,176,255,.13);
 --amber: #ddbc84; --amber-soft: rgba(205,158,87,.1); --green: #82ceb1;
 --shadow: 0 12px 38px rgba(0,0,0,.2), 0 1px 3px rgba(0,0,0,.1), inset 0 1px 0 var(--rim), inset 0 -1px 0 rgba(255,255,255,.035);
 --dot: rgba(157,181,213,.12); --card: rgba(36,44,57,.94);
 --focus: #91c6ff; --danger: #f59ca9;
}
* { box-sizing: border-box }
body { margin:0; color:var(--ink); background:var(--bg); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased }
body::before { content:""; position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 1% 0%,rgba(184,213,246,.3),transparent 43%),radial-gradient(ellipse at 96% 15%,rgba(204,209,230,.21),transparent 42%),radial-gradient(ellipse at 40% 105%,rgba(192,220,220,.18),transparent 45%) }
:root[data-theme=dark] body::before { opacity:.3 }
button,input { font:inherit; color:inherit }
button { cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent }
button:disabled { opacity:.4; cursor:default }
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,[tabindex]:focus-visible { outline:3px solid var(--focus); outline-offset:4px }
svg.icon { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0 }
.glass { background:linear-gradient(145deg,rgba(255,255,255,.12),transparent 65%),var(--glass); border:1px solid var(--rim); box-shadow:var(--shadow); backdrop-filter:blur(28px) saturate(160%); -webkit-backdrop-filter:blur(28px) saturate(160%) }
.app { position:relative; height:100dvh; min-height:480px; padding:28px 36px 22px; display:flex; flex-direction:column; gap:28px }
.header { display:flex; align-items:center; justify-content:space-between; gap:20px; min-height:46px }
.brand { display:flex; align-items:center; gap:12px }
.brand-mark { width:44px; height:44px; border-radius:16px; display:grid; place-items:center; color:var(--accent) }
.brand-mark .icon { width:23px; height:23px }
.brand-name { font-size:19px; letter-spacing:-.6px; font-weight:650 }
.eyebrow { color:var(--muted); font-size:11px; font-weight:500; letter-spacing:.1px }
.header-actions { display:flex; align-items:center; gap:18px }
.source { color:var(--muted); font-size:12px; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.segmented { display:flex; align-items:center; padding:5px; border-radius:999px; gap:2px }
.segmented button { border:0; background:transparent; min-height:38px; padding:9px 19px; border-radius:999px; color:var(--muted); font-weight:550; font-size:13px; white-space:nowrap; transition:background .18s,color .18s,box-shadow .18s }
.segmented button[aria-pressed=true] { background:var(--card); color:var(--ink); box-shadow:0 2px 9px rgba(30,50,90,.08),inset 0 1px 0 var(--rim) }
.themes button { width:38px; padding:8px; display:grid; place-items:center }
.themes .icon { width:18px; height:18px }
.intro { display:flex; justify-content:space-between; align-items:center; gap:40px; padding:0 4px }
.intro-copy { min-width:0; flex:1 }
h1 { font-size:clamp(25px,2.5vw,36px); font-weight:620; letter-spacing:-1.25px; line-height:1.2; margin:0 0 12px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow-wrap:anywhere }
.subtitle { color:var(--muted); font-size:12px; margin:0; line-height:2 }
.gate-badge { margin-left:10px; border:0; background:var(--amber-soft); color:var(--amber); border-radius:999px; padding:4px 10px; font-size:11px }
.gate-badge[data-passed=true] { background:var(--accent-soft); color:var(--green) }
.metrics { display:flex; gap:27px; flex-shrink:0; align-items:center }
.metric { min-width:82px; padding:0 0 0 25px; border-left:1px solid var(--line) }
.metric strong { font-size:27px; font-weight:550; letter-spacing:-.9px; display:block; line-height:1.3; font-variant-numeric:tabular-nums }
.metric small { color:var(--muted); font-size:11px; white-space:nowrap }
.layout { display:grid; grid-template-columns:minmax(0,1fr); gap:0; flex:1; min-height:0; position:relative }
.layout.details-open { grid-template-columns:minmax(0,1fr) 344px; gap:24px }
.map-panel { min-width:0; min-height:0; position:relative }
.toolbar { position:absolute; top:0; left:0; right:0; z-index:3; display:flex; align-items:center; justify-content:space-between; gap:20px; pointer-events:none }
.toolbar > * { pointer-events:auto }
.toolbar-actions { display:flex; align-items:center; gap:12px; min-width:0 }
.search-wrap { display:flex; align-items:center; gap:9px; min-width:0; width:224px; color:var(--muted); position:relative; padding:0 16px; height:50px; border-radius:999px }
.search-wrap input { min-width:0; width:100%; background:transparent; border:0; padding:10px 0; font-size:13px }
.search-wrap input:focus-visible { outline-offset:1px; border-radius:6px }
.search-wrap input::placeholder { color:var(--muted) }
.search-count { font-size:10px; white-space:nowrap }
#search-icon { display:flex }
.viewport { position:absolute; inset:0; min-height:160px; overflow:hidden; touch-action:none; cursor:grab; background-image:radial-gradient(var(--dot) .8px,transparent .8px); background-size:28px 28px; background-position:center; isolation:isolate; border-radius:18px }
.viewport.dragging { cursor:grabbing }
.world { position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform }
.connections { position:absolute; overflow:visible; pointer-events:none }
.edge { fill:none; stroke:var(--edge); stroke-width:1.35; stroke-linejoin:miter; vector-effect:non-scaling-stroke; opacity:.65 }
.edge.dependency { stroke:var(--amber); stroke-dasharray:6 4 }
.edge.active { stroke:var(--accent); stroke-width:1.8; opacity:.8 }
.node { position:absolute; width:258px; height:136px; appearance:none; display:flex; flex-direction:column; text-align:left; padding:18px 20px; border:1px solid var(--line); border-radius:23px; background:var(--card); box-shadow:0 6px 20px rgba(33,52,83,.04),0 1px 3px rgba(33,52,83,.025); transition:box-shadow .18s,border-color .18s,opacity .18s; overflow:hidden }
.node:hover { border-color:var(--edge); box-shadow:0 10px 30px rgba(33,52,83,.1) }
.node.selected { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft),0 8px 28px rgba(0,122,255,.07) }
.node.dimmed { opacity:.22 }
.node-top { display:flex; justify-content:space-between; align-items:center; gap:10px; color:var(--muted); font-size:10px; line-height:1.3; margin-bottom:9px }
.node-kind { display:flex; align-items:center; gap:5px; letter-spacing:.2px }
.node-kind .icon { width:13px; height:13px }
.node-id { max-width:90px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis }
.node-title { font-size:14px; line-height:1.38; font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; flex:1 }
.node-bottom { display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:8px; font-size:10px; color:var(--muted) }
.status-dot { display:inline-block; width:5px; height:5px; border-radius:50%; margin-right:5px; background:var(--muted) }
.status-dot.done { background:var(--green) }.status-dot.running { background:var(--amber) }
.node-score { color:var(--accent); font-variant-numeric:tabular-nums }
.map-footer { position:absolute; bottom:5px; left:0; right:0; display:flex; justify-content:center; align-items:center; pointer-events:none; gap:10px; z-index:3 }
.map-caption { position:absolute; left:4px; font-size:11px; color:var(--muted); max-width:calc(50% - 150px); line-height:1.8; white-space:pre-line }
.zoom-controls { display:flex; align-items:center; padding:6px; border-radius:999px; gap:3px; pointer-events:auto }
.icon-button { border:0; background:transparent; border-radius:50%; display:grid; place-items:center; width:38px; height:38px; transition:background .18s,color .18s }
.icon-button:hover { background:var(--accent-soft) }
.inspector-toggle { width:50px; height:50px; flex-shrink:0; border-radius:50%; display:grid; place-items:center }
.inspector-toggle[aria-expanded=true] { color:var(--accent) }
.zoom-value { font-size:12px; min-width:46px; text-align:center; color:var(--muted); font-variant-numeric:tabular-nums }
.divider { width:1px; height:16px; background:var(--line); margin:0 3px }
.zoom-reset { width:38px; font-size:11px; font-weight:550 }
.detail { border-radius:30px; overflow:hidden; display:none; flex-direction:column; min-height:0; margin:0 0 4px }
.detail.open { display:flex }
.detail-heading { padding:16px 17px 0; display:flex; align-items:center; justify-content:space-between; gap:8px }
.detail-scroll { padding:24px; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; flex:1 }
.detail-title { font-size:25px; font-weight:600; letter-spacing:-.7px; line-height:1.25; overflow-wrap:anywhere; margin:10px 0 16px }
.detail-id { font-size:11px; color:var(--muted); overflow-wrap:anywhere }
.chips { display:flex; flex-wrap:wrap; gap:7px }
.chip { border:0; border-radius:10px; padding:6px 9px; color:var(--muted); font-size:11px; background:var(--accent-soft); overflow-wrap:anywhere; max-width:100% }
button.chip:hover { color:var(--accent) }
.section { margin-top:29px }
.section h3 { font-size:12px; color:var(--muted); font-weight:550; margin:0 0 11px }
.section p,.section li { font-size:13px; line-height:1.7; margin:0 0 8px; overflow-wrap:anywhere }
.section ul { margin:0; padding-left:17px }.muted { color:var(--muted) }
.item { border:0; padding:14px 0; border-bottom:1px solid var(--line); margin:0 }
.item:last-child { border-bottom:0 }
.item-head { display:flex; gap:8px; align-items:baseline; justify-content:space-between }
.item strong { font-size:13px; font-weight:600; overflow-wrap:anywhere }
.item p { font-size:12px; color:var(--muted); margin:8px 0 0 }
.evidence-details,.record-details { margin-top:12px; font-size:12px; overflow-wrap:anywhere }
.evidence-details > summary,.record-details > summary { cursor:pointer; color:var(--accent); padding:3px 0 }
.evidence-card { margin-top:10px; padding:12px; border-radius:14px; background:var(--accent-soft); overflow-wrap:anywhere }
.evidence-card[data-status=superseded] { background:var(--amber-soft) }
.evidence-card .evidence-text { color:var(--ink); white-space:pre-wrap }
.evidence-card .evidence-meta { font-size:10px; margin:5px 0 0 }
.evidence-source a { color:var(--accent); text-decoration-thickness:1px; text-underline-offset:2px }
.record-field { margin-top:10px }
.record-field > .field-label { display:block; font-size:11px; color:var(--muted); margin-bottom:3px }
.record-field > p { margin:0; white-space:pre-wrap }
.question-options { margin-top:10px!important }
.question-options li { font-size:12px }
.rating { white-space:nowrap; font-size:10px; padding:3px 7px; border-radius:7px; background:var(--accent-soft); color:var(--accent) }
.rating.low { background:var(--amber-soft); color:var(--amber) }
.notice { color:var(--muted); background:var(--amber-soft); border-radius:16px; padding:13px 15px; font-size:12px; margin-top:15px; overflow-wrap:anywhere }
.progress { height:4px; background:var(--line); border-radius:9px; margin:16px 0 5px; overflow:hidden }
.progress-fill { height:100%; background:var(--accent); border-radius:9px }
.detail-tabs { display:flex; gap:2px; background:var(--accent-soft); border-radius:999px; padding:4px; flex:1 }
.detail-tabs button { padding:8px 12px; min-height:36px; border:0; border-radius:999px; background:transparent; color:var(--muted); font-size:12px; font-weight:550; flex:1; white-space:nowrap }
.detail-tabs button[aria-pressed=true] { color:var(--ink); background:var(--card); box-shadow:0 1px 4px rgba(33,52,83,.04) }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0 }
.empty-state { position:absolute; inset:30%; color:var(--muted); text-align:center; pointer-events:none }
.error { padding:30px; white-space:pre-wrap }
@media(max-width:1150px) {
 .app { padding:24px; gap:25px }.layout.details-open { grid-template-columns:minmax(0,1fr) 312px; gap:18px }
 .intro { gap:24px }.metrics { gap:17px }.metric { padding-left:17px; min-width:72px }.metric strong { font-size:24px }
 .modes button { padding:9px 14px }.search-wrap { width:180px }.toolbar,.toolbar-actions { gap:10px }
 .map-caption { display:none }.detail-scroll { padding:21px }
 .details-open .search-wrap { width:150px }.details-open .modes button { padding:9px 10px; font-size:12px }
}
@media(max-width:900px) and (min-width:761px) {
 .layout.details-open { grid-template-columns:minmax(0,1fr) 290px; gap:14px }
 .details-open .toolbar { flex-wrap:wrap; gap:10px }.details-open .toolbar-actions { width:100% }.details-open .search-wrap { flex:1 }
 .intro { align-items:flex-start }.metrics { gap:12px }.metric { padding-left:12px; min-width:60px }.metric:last-child { display:none }
}
@media(max-width:760px) {
 .app { padding:18px 16px 16px; gap:23px; min-height:460px }.header { min-height:42px; gap:12px }
 .brand { gap:10px }.brand-name { font-size:18px }.brand-mark { width:40px; height:40px; border-radius:14px }.brand .eyebrow { display:none }
 .source { display:none }.header-actions { gap:0 }.themes { padding:4px }.themes button { width:34px; min-height:34px; padding:8px }.themes .icon { width:17px; height:17px }
 .intro { flex-direction:column; align-items:stretch; gap:16px; padding:0 4px }.intro h1 { font-size:27px; letter-spacing:-.8px; margin-bottom:8px }
 .subtitle { font-size:10px }.gate-badge { font-size:10px; margin-left:7px; padding:3px 7px }
 .metrics { gap:24px; justify-content:flex-start }.metric { min-width:0; padding:0 22px 0 0; border-left:0; border-right:1px solid var(--line) }.metric:last-child { border:0; padding:0 }.metric strong { font-size:22px }.metric small { font-size:10px }
 .layout,.layout.details-open { display:block }.map-panel { height:100% }.toolbar { flex-wrap:wrap; gap:10px }.modes { padding:4px }.modes button { font-size:12px; padding:9px 15px; min-height:36px }
 .toolbar-actions { gap:8px; width:100% }.search-wrap,.details-open .search-wrap { flex:1; width:auto; height:44px }.inspector-toggle { width:44px; height:44px }
 .search-count { display:none }.map-caption { display:none }.map-footer { bottom:0 }.zoom-controls { padding:5px }.icon-button { width:38px; height:38px }.inspector-toggle { width:44px; height:44px }
 .detail { position:absolute; z-index:8; inset:auto -4px -4px; height:82%; max-height:550px; margin:0; border-radius:28px; background:var(--solid); box-shadow:0 -8px 40px rgba(0,0,0,.12) }
 .detail-heading { padding:14px 16px 0 }.detail-scroll { padding:20px 23px }.detail-title { font-size:23px }
}
@media(max-height:700px) and (max-width:760px) { .app { gap:14px; padding-top:12px }.intro { gap:10px }.intro h1 { font-size:22px }.metrics { display:none }.toolbar { gap:7px }.detail { height:90% } }
@media(prefers-reduced-motion:reduce) { * { transition:none!important; scroll-behavior:auto!important } }
@media(prefers-reduced-transparency:reduce) { .glass { background:var(--solid); backdrop-filter:none; -webkit-backdrop-filter:none }.node { background:var(--solid) } }
@media(prefers-contrast:more) { :root { --muted:#454d59; --line:#838d9c; --edge:#63758a } :root[data-theme=dark] { --muted:#d3dae5; --line:#7e8da2; --edge:#a3b5cd } .glass { background:var(--solid); border-color:var(--line) }.node { border-color:var(--line) } }
@supports not (backdrop-filter:blur(1px)) { .glass { background:var(--solid) } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div class="brand"><div class="brand-mark glass" id="brand-icon"></div><div><div class="brand-name">Interview</div><div class="eyebrow" data-i18n="tagline">A clearer path to done</div></div></div>
    <div class="header-actions"><span class="source" id="source"></span><div class="themes segmented glass" role="group" data-label="theme"><button type="button" data-theme-choice="light" data-label="light"></button><button type="button" data-theme-choice="dark" data-label="dark"></button><button type="button" data-theme-choice="auto" data-label="auto"></button></div></div>
  </header>
  <section class="intro"><div class="intro-copy"><h1 id="goal"></h1><p class="subtitle" id="subtitle"></p></div><div class="metrics"><div class="metric"><strong id="readiness"></strong><small data-i18n="readiness">Readiness</small></div><div class="metric"><strong id="completed"></strong><small data-i18n="completed">Tasks completed</small></div><div class="metric"><strong id="open-decisions"></strong><small data-i18n="decisionsLeft">Open decisions</small></div></div></section>
  <main class="layout">
    <section class="map-panel" data-label="taskMap">
      <div class="toolbar"><div class="segmented modes glass" role="group" data-label="graphMode"><button type="button" data-mode="structure" aria-pressed="true" data-i18n="structure">Structure</button><button type="button" data-mode="dependencies" aria-pressed="false" data-i18n="dependencies">Execution order</button></div><div class="toolbar-actions"><label class="search-wrap glass"><span id="search-icon"></span><span class="sr-only" data-i18n="search">Find a task</span><input id="search" type="search" autocomplete="off" data-placeholder="search"><span class="search-count" id="search-count" aria-live="polite"></span></label><button type="button" class="inspector-toggle glass" id="show-details" data-label="details" aria-controls="detail" aria-expanded="false"></button></div></div>
      <div class="viewport" id="viewport" tabindex="0" role="region" data-label="canvas" aria-describedby="canvas-help"><div class="world" id="world"></div></div>
      <div class="map-footer"><div class="map-caption" id="canvas-help"></div><div class="zoom-controls glass" role="group" data-label="zoom"><button type="button" class="icon-button" id="zoom-out" data-label="zoomOut"></button><output class="zoom-value" id="zoom-value" aria-live="polite">100%</output><button type="button" class="icon-button" id="zoom-in" data-label="zoomIn"></button><span class="divider"></span><button type="button" class="icon-button" id="fit" data-label="fit"></button><button type="button" class="icon-button zoom-reset" id="actual-size" data-label="actualSize">1:1</button></div></div>
    </section>
    <aside class="detail glass" id="detail" aria-label="Details"><div class="detail-heading"><div class="detail-tabs" role="group" data-label="details"><button type="button" data-tab="task" aria-pressed="true" data-i18n="taskDetails">Task details</button><button type="button" data-tab="interview" aria-pressed="false" data-i18n="interview">Interview</button></div><button type="button" class="icon-button" id="close-details" data-label="close"></button></div><div class="detail-scroll" id="detail-content"></div></aside>
  </main>
</div>
<script id="interview-data" type="application/json">__INTERVIEW_DATA__</script>
<script>
'use strict';
(() => {
const data = JSON.parse(document.getElementById('interview-data').textContent);
const words = {
 tagline: 'A clearer path to done',
 theme: 'Appearance',
 light: 'Light theme',
 dark: 'Dark theme',
 auto: 'System theme',
 readiness: 'Readiness',
 completed: 'Tasks completed',
 decisionsLeft: 'Open decisions',
 taskMap: 'Task map',
 graphMode: 'Graph view',
 structure: 'Structure',
 dependencies: 'Execution order',
 search: 'Find a task',
 canvas: 'Interactive task graph',
 zoom: 'Zoom controls',
 zoomIn: 'Zoom in (+)',
 zoomOut: 'Zoom out (−)',
 fit: 'Fit all tasks (0)',
 actualSize: 'Actual size (1)',
 details: 'Open details',
 taskDetails: 'Task details',
 interview: 'Interview',
 close: 'Close details',
 group: 'Group',
 leaf: 'Task',
 pending: 'Pending',
 running: 'In progress',
 done: 'Completed',
 notScored: 'Not evaluated',
 snapshot: 'Saved snapshot',
 revision: 'Revision',
 ready: 'Ready to begin',
 needsAnswers: 'Needs clarification',
 help: 'Scroll to zoom · drag to move · 0 to fit',
 nodes: 'tasks',
 links: 'connections',
 parent: 'Part of',
 children: 'Contains',
 inputs: 'Inputs',
 deliverable: 'Expected result',
 checks: 'Done when',
 verification: 'How to check',
 requirements: 'Requirements',
 criteria: 'Readiness checks',
 decisions: 'Decisions',
 required: 'Required',
 optional: 'Optional',
 unresolved: 'Not decided',
 resolved: 'Decided',
 deferred: 'Deferred',
 before: 'Must finish first',
 after: 'Unblocks',
 none: 'None recorded',
 unknown: 'Not defined yet',
 groupHint: 'This group is complete when all its tasks are done. Its score counts each readiness check once.',
 request: 'Original request',
 success: 'Success looks like',
 scope: 'In scope',
 outOfScope: 'Out of scope',
 blockers: 'What is still needed',
 questions: 'Questions',
 profile: 'Explanation preferences',
 emptyQuestions: 'No questions recorded yet.',
 noMatch: 'No matches',
 matches: 'matches',
 stale: 'There is no evaluation for this revision. Scores stay blank until it is evaluated.',
 legacy: 'Legacy file · read-only view. Upgrade the state before a new interview round.',
 snapshotHint: 'This page is a snapshot. Regenerate it after changing the TOML file.',
 evidence: 'Evidence',
 answered: 'Answered',
 skipped: 'Skipped',
 superseded: 'Superseded',
 interviewing: 'Interviewing',
 executing: 'Executing',
 paused: 'Paused',
 blocked: 'Blocked',
 overridden: 'Proceeding with gaps',
 open: 'Open'
};
const t = key => words[key] || key;

 if(!data.attempts?.length)history.append(make('p','muted','No non-question actions recorded.'));for(const attempt of data.attempts||[])history.append(renderAttempt(attempt));
 section('profile',data.user.preferred_style);
}
function renderDetails(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===detailTab)));detail.replaceChildren();detail.scrollTop=0;if(detailTab==='interview'){renderInterview();return;}
const n=nodes.get(selected);if(!n)return;detail.append(make('div','detail-id',`${t(n.kind)} · ${n.id}`),make('h2','detail-title',n.title));const chips=make('div','chips');chips.append(make('span','chip',t(n.status)),make('span','chip',n.score===null?t('notScored'):`${t('readiness')} ${Math.round(n.score)}%`));detail.append(chips);if(n.score!==null){const bar=make('div','progress'),fill=make('div','progress-fill');fill.style.width=`${Math.max(0,Math.min(100,n.score))}%`;bar.append(fill);detail.append(bar);}if(!data.summary.has_current_evaluation)detail.append(make('div','notice',t('stale')));if(n.kind==='group')detail.append(make('div','notice',t('groupHint')));taskLinks('parent',n.parent_id?[n.parent_id]:[]);taskLinks('children',n.children);if(n.deliverable||n.kind==='leaf')section('deliverable',n.deliverable);if(n.inputs?.length)section('inputs',n.inputs);if(n.done_when?.length||n.kind==='leaf')section('checks',n.done_when);if(n.verification||n.kind==='leaf')section('verification',n.verification);
const ownLeaves=descendants.get(n.id)||new Set([n.id]);const before=new Set(),after=new Set();for(const e of dependencies){if(ownLeaves.has(e.target)&&!ownLeaves.has(e.source))before.add(e.source);if(ownLeaves.has(e.source)&&!ownLeaves.has(e.target))after.add(e.target);}taskLinks('before',[...before]);taskLinks('after',[...after]);if(n.requirement_ids.length){const s=section('requirements');for(const id of n.requirement_ids){const r=data.requirements.find(r=>r.id===id),item=make('div','item requirement');item.dataset.requirementId=id;item.append(make('strong','',r?.description||id));evidenceDetails(item,'Requirement evidence',r?.evidence_ids,{showEmpty:true});s.append(item);}}
if(n.criteria.length){const s=section('criteria');for(const c of n.criteria){const item=make('div','item criterion'),head=make('div','item-head');item.dataset.criterionId=c.id;head.append(make('strong','',c.description),make('span',`rating ${c.score===null||c.score<2?'low':''}`,c.score===null?'—':`${c.score}/2`));item.append(head,make('p','',`${t(c.required?'required':'optional')} · ${c.check}`));if(c.reason)item.append(make('p','',c.reason));if(c.reported_score!==null&&c.reported_score!==c.score)recordField(item,'Evaluator reported',`${c.reported_score}/2 · credited ${c.score}/2`);evidenceDetails(item,'Rating evidence',c.rating_evidence_ids,{showEmpty:true});evidenceDetails(item,'Linked evidence',c.evidence_ids);for(const id of c.decision_ids||[]){const d=allDecisions.get(id);if(d)evidenceDetails(item,`Decision evidence · ${d.question}`,d.evidence_ids,{showEmpty:true});}s.append(item);}}
if(n.decisions.length){const s=section('decisions');for(const d of n.decisions){const item=make('div','item decision');item.dataset.decisionId=d.id;item.append(make('strong','',d.question),make('p','',`${t(d.status)}${d.value?' · '+d.value:''}`));evidenceDetails(item,'Decision evidence',d.evidence_ids,{showEmpty:true});s.append(item);}}
}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{detailTab=b.dataset.tab;renderDetails();}));$('#show-details').addEventListener('click',()=>setDetails(!$('#detail').classList.contains('open')));$('#close-details').addEventListener('click',()=>setDetails(false,true));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#detail').classList.contains('open'))setDetails(false,true);});
draw();renderDetails();document.documentElement.dataset.ready='true';
})();
