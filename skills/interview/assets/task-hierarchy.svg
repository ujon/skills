<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">Tasks contain tasks; dependencies order execution</title>
  <desc id="desc">The website task contains the page group and the checking task. The page group contains content and page-building tasks. Page building waits for content; checking waits for all leaves of the page group. Blue solid arrows show parent to child, and orange dashed arrows show prerequisite to dependent. Every connector has at most two right-angle bends.</desc>
  <defs>
    <marker id="parent-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><polygon points="0,0 10,5 0,10" fill="#526b96"/></marker>
    <marker id="dependency-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><polygon points="0,0 10,5 0,10" fill="#b65d13"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #243447; font-size: 18px; text-anchor: middle; }
      .node { fill: #f7f9fc; stroke: #7b8b9d; stroke-width: 1.5; }
      .group { fill: #edf3fa; stroke: #7b96b3; }
      .edge { fill: none; stroke-width: 2; stroke-linejoin: miter; stroke-linecap: butt; }
      .parent { stroke: #526b96; marker-end: url(#parent-arrow); }
      .dependency { stroke: #b65d13; stroke-dasharray: 8 5; marker-end: url(#dependency-arrow); }
      .label { font-size: 16px; }
      .id { font-size: 15px; fill: #59687a; }
    </style>
  </defs>
  <rect width="1100" height="680" fill="#ffffff"/>
  <g aria-label="Parent to child relationships">
    <polyline class="edge parent" data-source="t0" data-target="s1" points="500,110 500,175 370,175 370,245"/>
    <polyline class="edge parent" data-source="t0" data-target="s2" points="720,75 1035,75 1035,500"/>
    <polyline class="edge parent" data-source="s1" data-target="s1-content" points="290,315 290,400 180,400 180,500"/>
    <polyline class="edge parent" data-source="s1" data-target="s1-page" points="450,315 450,400 570,400 570,500"/>
  </g>
  <g aria-label="Prerequisite to dependent relationships">
    <polyline class="edge dependency" data-source="s1-content" data-target="s1-page" points="330,560 420,560"/>
    <polyline class="edge dependency" data-source="s1" data-target="s2" points="520,280 930,280 930,500"/>
  </g>
  <text class="label" x="724" y="264">Check waits for all page leaves</text>
  <text class="label" x="375" y="626">Page waits for content</text>
  <g data-node="t0" id="t0">
    <rect class="node group" x="420" y="40" width="300" height="70"/>
    <text x="570" y="69">Create the shop website</text><text class="id" x="570" y="94">t0 · root</text>
  </g>
  <g data-node="s1" id="s1">
    <rect class="node group" x="220" y="245" width="300" height="70"/>
    <text x="370" y="274">Build the shop page</text><text class="id" x="370" y="299">s1 · parent: t0</text>
  </g>
  <g data-node="s1-content" id="s1-content">
    <rect class="node" x="30" y="500" width="300" height="100"/>
    <text x="180" y="540">Prepare page content</text><text class="id" x="180" y="571">s1-content · parent: s1</text>
  </g>
  <g data-node="s1-page" id="s1-page">
    <rect class="node" x="420" y="500" width="300" height="100"/>
    <text x="570" y="540">Create the page</text><text class="id" x="570" y="571">s1-page · parent: s1</text>
  </g>
  <g data-node="s2" id="s2">
    <rect class="node" x="790" y="500" width="280" height="100"/>
    <text x="930" y="540">Check the visitor journey</text><text class="id" x="930" y="571">s2 · parent: t0</text>
  </g>
  <text class="label" x="305" y="662" style="fill:#526b96">Solid blue: contains</text>
  <text class="label" x="735" y="662" style="fill:#b65d13">Dashed orange: must finish before</text>
</svg>
